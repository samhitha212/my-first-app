<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 3.5em;
            color: #00d4ff;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            letter-spacing: 2px;
        }

        .quote-container {
            margin: 40px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quote {
            font-size: 1.3em;
            color: #e0e0e0;
            font-style: italic;
            line-height: 1.8;
            transition: all 0.5s ease-in-out;
            opacity: 1;
        }

        .quote.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .quote.fade-in {
            opacity: 1;
            transform: translateY(0);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #1a1a2e;
            border: none;
            padding: 16px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.6);
            background: linear-gradient(135deg, #00e6ff 0%, #00aadd 100%);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.4);
        }

        .accent-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Coding Journey</h1>
        <div class="accent-line"></div>
        <div class="quote-container">
            <p class="quote" id="quote">The best way to predict the future is to invent it.</p>
        </div>
        <div class="accent-line"></div>
        <button onclick="generateNewQuote()">Generate New Quote</button>
    </div>

    <script>
        const quotes = [
            "The best way to predict the future is to invent it.",
            "Code is poetry written in a language computers understand.",
            "Every expert was once a beginner who never gave up.",
            "The only way to do great work is to love what you do.",
            "Innovation distinguishes between a leader and a follower."
        ];

        let currentIndex = 0;

        function generateNewQuote() {
            const quoteElement = document.getElementById('quote');
            
            // Fade out effect
            quoteElement.classList.remove('fade-in');
            quoteElement.classList.add('fade-out');

            setTimeout(() => {
                // Get a random quote
                currentIndex = Math.floor(Math.random() * quotes.length);
                quoteElement.textContent = quotes[currentIndex];
                
                // Fade in effect
                quoteElement.classList.remove('fade-out');
                quoteElement.classList.add('fade-in');
            }, 300);
        }
    </script>
</body>
</html>
